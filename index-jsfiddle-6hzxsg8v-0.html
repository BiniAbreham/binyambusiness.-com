<!DOCTYPE html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSFiddle 6hzxsg8v</title>

  <style>
    body {
    background-color: #0f172a;
      color: white;
        font-family: Arial, sans-serif;
          text-align: center;
            padding: 20px;
            }

            h1 {
              color: #38bdf8;
              }

              h2 {
                color: #4ade80;
                }

                .service {
                  background-color: #1e293b;
                    padding: 20px;
                      margin: 15px auto;
                        border-radius: 12px;
                          max-width: 400px;
                          }

                          button {
                            background-color: #16a34a;
                              color: white;
                                padding: 12px 20px;
                                  border: none;
                                    border-radius: 8px;
                                      cursor: pointer;
                                        margin: 5px;
                                        }

                                        button:hover {
                                          background-color: #15803d;
                                          }

                                          #message {
                                            color: #38bdf8;
                                              font-size: 18px;
                                              }
}
  </style>

  
</head>
<body>
  <h1>BINYAM BUSINESS</h1>

<p>Welcome to my business website!</p>

<h2>Our Services</h2>

<div class="service">
  <h3>Website Design</h3>
    <p>We build modern websites.</p>
      <button onclick="showService('Website Design')">
          Learn More
            </button>
            </div>

            <div class="service">
              <h3>Poster Design</h3>
                <p>Creative posters for your business.</p>
                  <button onclick="showService('Poster Design')">
                      Learn More
                        </button>
                        </div>

                        <div class="service">
                          <h3>YouTube Thumbnail</h3>
                            <p>Attractive thumbnails for videos.</p>
                              <button onclick="showService('YouTube Thumbnail')">
                                  Learn More
                                    </button>
                                    </div>

                                    <p id="message"></p>

                                    <button onclick="contactUs()">Contact Us</button>

  <script>
    function showService(serviceName) {
    const message = document.getElementById("message");

      if (serviceName === "Website Design") {
          message.textContent =
                "We create modern websites for your business!";
                  } else if (serviceName === "Poster Design") {
                      message.textContent =
                            "We design creative posters for your business!";
                              } else if (serviceName === "YouTube Thumbnail") {
                                  message.textContent =
                                        "We create attractive YouTube thumbnails!";
                                          }
                                          }

                                          function contactUs() {
                                            document.getElementById("message").textContent =
                                                "Contact BINYAM BUSINESS to discuss your project!";
                                                }
}
  </script>
</body>
</html>
